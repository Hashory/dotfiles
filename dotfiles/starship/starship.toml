"$schema" = 'https://starship.rs/config-schema.json'

# Prompt format
# - Minimal, subdued styling without heavy background blocks
# - Git and language/project runtime modules removed per user request
# - Explicit foreground colors defined for high readability on dark terminals
format = """
$os\
$username\
$hostname\
$directory\
$cmd_duration\
$character"""

# Blank line before prompt for readability
add_newline = true

[character]
success_symbol = "[❯](bold fg:#73daca)"
error_symbol = "[❯](bold fg:#e06c75)"
vimcmd_symbol = "[❮](bold fg:#70ace6)"

[directory]
style = "bold fg:#70ace6"
read_only = " 󰌾"
read_only_style = "bold fg:#e06c75"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[username]
show_always = false
style_user = "fg:#abb2bf"
style_root = "bold fg:#e06c75"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "fg:#98c379"
format = "[$hostname]($style) in "

# Git modules are disabled
[git_branch]
disabled = true

[git_status]
disabled = true

[git_state]
disabled = true

[git_metrics]
disabled = true

[cmd_duration]
min_time = 2_000
style = "fg:#e5c07b"
format = "took [$duration]($style) "

[time]
disabled = true
